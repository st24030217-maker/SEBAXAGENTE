<!doctype html>
<html lang="es" data-resolution="portrait"
  data-composition-variables='[
    {"id":"k1","type":"string","label":"Escena 1: etiqueta","default":"¿TODAVÍA ASÍ?"},
    {"id":"t1","type":"string","label":"Escena 1: texto (gancho)","default":"Pedidos en una libreta"},
    {"id":"k2","type":"string","label":"Escena 2: etiqueta","default":"EL PROBLEMA"},
    {"id":"t2","type":"string","label":"Escena 2: texto","default":"Clientes que no regresan"},
    {"id":"k3","type":"string","label":"Escena 3: etiqueta","default":"LA SOLUCIÓN"},
    {"id":"t3","type":"string","label":"Escena 3: texto","default":"Tu menú en su celular"},
    {"id":"k4","type":"string","label":"Escena 4: etiqueta","default":"RESULTADO"},
    {"id":"t4","type":"string","label":"Escena 4: texto","default":"Pedidos directo a WhatsApp"},
    {"id":"cta","type":"string","label":"Cierre: pregunta","default":"¿Lo quieres para tu negocio?"},
    {"id":"estilo","type":"string","label":"Estilo (JSON de estilos.json)","default":""}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Reel diario de Instagram (scripts/contenido-ig.mjs). Debajo va assets/base.mp4: 4 clips reales
         unidos con transiciones (cortes en 3, 6 y 9 s). Encima, un texto corto por escena y el cierre.
         El diseño (tipografía, colores, posición, animación) sale de la variable "estilo" (estilos.json). */
      @font-face { font-family: "Archivo Black"; src: url("assets/fonts/ArchivoBlack-Regular.ttf"); }
      @font-face { font-family: "League Gothic"; src: url("assets/fonts/LeagueGothic.ttf"); }
      @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald.ttf"); font-weight: 200 700; }
      @font-face { font-family: "Outfit"; src: url("assets/fonts/Outfit.ttf"); font-weight: 100 900; }
      @font-face { font-family: "Playfair Display"; src: url("assets/fonts/PlayfairDisplay-Italic.ttf"); font-style: italic; font-weight: 400 900; }
      :root { --chip: #2f7cf6; --chipInk: #fff; --ink: #fff; --hl: #25d366; --fin: #2f7cf6; --finInk: #fff; --btn: #25d366; --btnInk: #06210f;
              --w1: #2f7cf6; --w2: #25d366; --w3: #2f7cf6; --w4: #fff; --font: "Archivo Black"; --dark: #070a12; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--dark); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Inter", sans-serif; color: #fff; overflow: hidden; }
      .full { position: absolute; inset: 0; }
      .big { font-family: var(--font), sans-serif; letter-spacing: -0.03em; line-height: 1; }

      #base { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #sombra { background: linear-gradient(180deg, rgba(7,10,18,.55) 0%, rgba(7,10,18,0) 28%, rgba(7,10,18,0) 48%, rgba(7,10,18,.82) 100%); }
      [data-sombra="toda"] #sombra { background: rgba(7,10,18,.5); }
      [data-sombra="arriba"] #sombra { background: linear-gradient(180deg, rgba(7,10,18,.85) 0%, rgba(7,10,18,.35) 45%, rgba(7,10,18,.1) 80%, rgba(7,10,18,.5) 100%); }
      [data-sombra="ninguna"] #sombra { background: linear-gradient(180deg, rgba(7,10,18,.4) 0%, rgba(7,10,18,0) 20%, rgba(7,10,18,0) 82%, rgba(7,10,18,.45) 100%); }

      .cap { position: absolute; left: 90px; right: 90px; top: 1140px; }
      [data-pos="centro"] .cap { top: 640px; text-align: center; }
      [data-pos="arriba"] .cap { top: 330px; }
      .cap .k { display: inline-block; font-size: 34px; font-weight: 800; letter-spacing: .16em; background: var(--chip); color: var(--chipInk); padding: 12px 22px; border-radius: 10px; }
      .cap .t { font-size: 118px; margin-top: 30px; color: var(--ink); overflow-wrap: break-word; text-shadow: 0 6px 40px rgba(0,0,0,.45); }
      .cap .t .w { display: inline-block; margin-right: .18em; }
      .cap .t .w.hl { color: var(--hl); }
      [data-mayus="1"] .cap .t { text-transform: uppercase; letter-spacing: 0; line-height: .92; }
      [data-italica="1"] .cap .t { font-style: italic; letter-spacing: -0.01em; line-height: 1.05; }
      [data-brillo="1"] .cap .t .w.hl { text-shadow: 0 0 30px var(--hl), 0 0 70px var(--hl); }
      [data-caja="1"] .cap .t { text-shadow: none; line-height: 1.22; }
      [data-caja="1"] .cap .t .w { background: #fff; padding: 2px 18px 8px; margin: 0 8px 12px 0; border-radius: 8px; }
      [data-caja="1"] .cap .t .w.hl { background: var(--hl); color: #fff; }
      /* Logo y @ abajo (arriba estorbaban con la interfaz de Instagram) */
      #marca { position: absolute; left: 90px; top: 1690px; width: 96px; height: auto; opacity: .95; filter: drop-shadow(0 3px 12px rgba(0,0,0,.45)); }
      #handle { position: absolute; left: 204px; top: 1718px; font-size: 38px; font-weight: 800; letter-spacing: .02em; text-shadow: 0 2px 14px rgba(0,0,0,.5); }
      #flash { background: #fff; opacity: 0; }
      /* Estilos tranquilos (minimalistas): etiqueta en texto simple, letra más fina */
      [data-etiqueta="texto"] .cap .k { background: none; padding: 0; color: #fff; opacity: .8; font-weight: 600; font-size: 28px; letter-spacing: .32em; }
      [data-calma="1"] .cap .t { font-weight: 500; letter-spacing: -0.02em; line-height: 1.08; text-shadow: 0 2px 24px rgba(0,0,0,.35); }
      [data-calma="1"] #end-q { font-weight: 500; letter-spacing: -0.02em; }
      [data-calma="1"] #end-cta { font-size: 46px; font-weight: 700; padding: 28px 52px; }
      [data-calma="1"] #handle { font-weight: 600; font-size: 32px; top: 1722px; opacity: .9; }
      .wipe { position: absolute; left: 0; top: -10%; width: 100%; height: 120%; z-index: 50; }
      #w1 { background: var(--w1); } #w2 { background: var(--w2); } #w3 { background: var(--w3); } #w4 { background: var(--w4); }

      #end { background: var(--fin); color: var(--finInk); }
      #end-in { position: absolute; left: 80px; right: 80px; top: 420px; text-align: center; }
      #end-logo { width: 560px; height: auto; display: block; margin: 0 auto; }
      [data-oscuro="1"] #end-logo { filter: brightness(0); }
      #end-q { font-size: 92px; margin-top: 90px; }
      [data-mayus="1"] #end-q { text-transform: uppercase; letter-spacing: 0; }
      [data-italica="1"] #end-q { font-style: italic; }
      #end-cta { display: inline-block; margin-top: 80px; background: var(--btn); color: var(--btnInk); border-radius: 999px; font-size: 60px; font-weight: 900; padding: 36px 66px; }
      #end-who { font-size: 44px; font-weight: 700; margin-top: 50px; opacity: .92; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <video id="base" class="clip" src="assets/base.mp4" muted playsinline data-start="0" data-duration="12.2" data-track-index="0"></video>
      <div id="sombra" class="clip full" data-start="0" data-duration="12.2" data-track-index="1" data-layout-ignore></div>

      <div id="hud" class="clip full" data-start="0" data-duration="12.2" data-track-index="2" data-track-kind="graphics">
        <img id="marca" src="assets/logo-simbolo.png" alt="sss.solutions" />
        <div id="handle">@ssss.olutions</div>
      </div>
      <div id="flash" class="clip full" data-start="0" data-duration="12.2" data-track-index="7" data-layout-ignore></div>

      <div id="s1" class="clip full" data-start="0" data-duration="3" data-track-index="3" data-track-kind="graphics">
        <div class="cap"><div class="k" data-var-text="k1">¿TODAVÍA ASÍ?</div><div class="t big" data-var-text="t1">Pedidos en una libreta</div></div>
      </div>
      <div id="s2" class="clip full" data-start="3" data-duration="3" data-track-index="3" data-track-kind="graphics">
        <div class="cap"><div class="k" data-var-text="k2">EL PROBLEMA</div><div class="t big" data-var-text="t2">Clientes que no regresan</div></div>
      </div>
      <div id="s3" class="clip full" data-start="6" data-duration="3" data-track-index="3" data-track-kind="graphics">
        <div class="cap"><div class="k" data-var-text="k3">LA SOLUCIÓN</div><div class="t big" data-var-text="t3">Tu menú en su celular</div></div>
      </div>
      <div id="s4" class="clip full" data-start="9" data-duration="3.2" data-track-index="3" data-track-kind="graphics">
        <div class="cap"><div class="k" data-var-text="k4">RESULTADO</div><div class="t big" data-var-text="t4">Pedidos directo a WhatsApp</div></div>
      </div>

      <div id="end" class="clip full" data-start="12" data-duration="3" data-track-index="4" data-track-kind="graphics">
        <div id="end-in">
          <img id="end-logo" src="assets/logo.png" alt="sss.solutions" />
          <div id="end-q" class="big" data-var-text="cta">¿Lo quieres para tu negocio?</div>
          <div id="end-cta">WhatsApp 871 916 4677</div>
          <div id="end-who">Sebastián Salinas · La Laguna</div>
        </div>
      </div>

      <audio id="musica" src="assets/musica.m4a" data-start="0" data-duration="15" data-track-index="6" data-volume="1"></audio>

      <div id="w1" class="clip wipe" data-start="2.75" data-duration="0.5" data-track-index="5" data-layout-ignore></div>
      <div id="w2" class="clip wipe" data-start="5.75" data-duration="0.5" data-track-index="5" data-layout-ignore></div>
      <div id="w3" class="clip wipe" data-start="8.75" data-duration="0.5" data-track-index="5" data-layout-ignore></div>
      <div id="w4" class="clip wipe" data-start="11.75" data-duration="0.5" data-track-index="5" data-layout-ignore></div>
    </div>

    <script>
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      let E = {};
      try { E = JSON.parse(vars.estilo || "{}"); } catch (e) {}
      const root = document.getElementById("root");
      const css = document.documentElement.style;
      ["chip", "chipInk", "ink", "hl", "fin", "finInk"].forEach((k) => E[k] && css.setProperty(`--${k}`, E[k]));
      // (el botón usa --btn: "--cta" lo pisa la variable "cta" del texto de cierre)
      if (E.cta) css.setProperty("--btn", E.cta);
      if (E.ctaInk) css.setProperty("--btnInk", E.ctaInk);
      (E.wipes || []).forEach((c, i) => css.setProperty(`--w${i + 1}`, c));
      if (E.font) css.setProperty("--font", `"${E.font}"`);
      root.dataset.pos = E.pos || "abajo";
      root.dataset.sombra = E.sombra || "abajo";
      root.dataset.mayus = E.mayus ? "1" : "0";
      root.dataset.caja = E.caja ? "1" : "0";
      root.dataset.oscuro = E.oscuro ? "1" : "0";
      root.dataset.brillo = E.brillo ? "1" : "0";
      root.dataset.calma = E.calma ? "1" : "0";
      root.dataset.etiqueta = E.etiqueta || "chip";
      const calma = !!E.calma;
      root.dataset.italica = E.font === "Playfair Display" ? "1" : "0";
      const escala = E.escala || 1;
      const anim = E.anim || "pop";
      const wipe = E.wipe || "vertical";

      // Cada texto se parte en palabras (entran una por una); la última va resaltada. El tamaño baja si es largo.
      document.querySelectorAll(".cap .t").forEach((el) => {
        const texto = String(vars[el.getAttribute("data-var-text")] || el.textContent).trim();
        const palabras = texto.split(/\s+/);
        el.textContent = "";
        palabras.forEach((p, i) => {
          const s = document.createElement("span");
          s.className = "w" + (i === palabras.length - 1 ? " hl" : "");
          s.textContent = p;
          el.appendChild(s);
        });
        const L = texto.length;
        el.style.fontSize = Math.round((L <= 14 ? 140 : L <= 22 ? 118 : L <= 32 ? 100 : 84) * escala) + "px";
      });
      const q = document.getElementById("end-q");
      const lq = String(vars.cta || q.textContent).length;
      q.style.fontSize = Math.round((lq <= 22 ? 100 : lq <= 34 ? 86 : 72) * Math.min(escala, 1.3)) + "px";

      const ENTRA = {
        pop: [{ opacity: 0, y: 90, scale: 1.35 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, stagger: 0.1, ease: "back.out(2)" }],
        caida: [{ opacity: 0, y: -160, rotation: -6 }, { opacity: 1, y: 0, rotation: 0, duration: 0.36, stagger: 0.09, ease: "bounce.out" }],
        desliza: [{ opacity: 0, x: -140, rotation: -4 }, { opacity: 1, x: 0, rotation: 0, duration: 0.3, stagger: 0.08, ease: "power4.out" }],
        sube: [{ opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.12, ease: "power3.out" }],
      }[anim] || [];

      const tl = gsap.timeline({ paused: true });
      if (calma) tl.fromTo("#marca", { opacity: 0 }, { opacity: 0.95, duration: 0.6, ease: "power2.out" }, 0);
      else tl.fromTo("#marca", { opacity: 0, rotation: -40, scale: 0.6 }, { opacity: 0.95, rotation: 0, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0);
      tl.fromTo("#handle", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.15);

      [0, 3, 6, 9].forEach((t, i) => {
        const s = `#s${i + 1}`;
        tl.fromTo(`${s} .k`, { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.3, ease: "power4.out" }, t + 0.15);
        tl.fromTo(`${s} .w`, ENTRA[0], ENTRA[1], t + 0.3);
        if (!calma) tl.fromTo(`${s} .w.hl`, { scale: 1 }, { scale: 1.08, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, t + 1.3);
        tl.fromTo(`${s} .cap`, { opacity: 1, y: 0 }, { opacity: 0, y: -50, duration: 0.18, ease: "power2.in", immediateRender: false }, t + (i === 3 ? 2.95 : 2.75));
      });

      ["#w1", "#w2", "#w3", "#w4"].forEach((w, i) => {
        const t = 2.75 + i * 3;
        if (calma && i < 3) return;
        if (wipe === "ninguno") {
          // Destello suave en lugar de cortinilla
          tl.fromTo(w, { opacity: 0 }, { opacity: i === 3 ? 1 : 0.85, duration: 0.2, ease: "power2.in" }, t);
          tl.fromTo(w, { opacity: i === 3 ? 1 : 0.85 }, { opacity: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, t + 0.25);
        } else {
          const eje = wipe === "horizontal" ? "xPercent" : "yPercent";
          const dir = i % 2 ? -1 : 1;
          tl.fromTo(w, { [eje]: 100 * dir }, { [eje]: 0, duration: 0.22, ease: "power3.in" }, t);
          tl.fromTo(w, { [eje]: 0 }, { [eje]: -100 * dir, duration: 0.24, ease: "power3.out", immediateRender: false }, t + 0.25);
        }
      });

      if (calma) tl.fromTo("#end-logo", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 12.15);
      else tl.fromTo("#end-logo", { opacity: 0, scale: 0.4, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2)" }, 12.15);
      tl.fromTo("#end-q", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 12.5);
      if (calma) tl.fromTo("#end-cta", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 12.9);
      else tl.fromTo("#end-cta", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.5)" }, 12.85);
      if (!calma) tl.fromTo("#end-cta", { scale: 1 }, { scale: 1.06, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, 13.4);
      tl.fromTo("#end-who", { opacity: 0 }, { opacity: 0.92, duration: 0.3 }, 13.2);

      // --- Más dinámico ---
      // Movimiento de cámara: cada toma (1.5 s) se acerca; una sí y una no, se aleja. Al corte "salta".
      const cortes = [0, 1.5, 3, 4.5, 6, 7.5, 9, 10.6, 12.2];
      for (let i = 0; i < cortes.length - 1; i++) {
        const [a, b] = calma ? [1.0, 1.04] : i % 2 ? [1.12, 1.02] : [1.0, 1.1];
        const giro = calma ? 0 : i % 2 ? -0.6 : 0.6;
        tl.fromTo("#base", { scale: a, rotation: giro }, { scale: b, rotation: 0, duration: cortes[i + 1] - cortes[i], ease: "power1.out", immediateRender: i === 0 }, cortes[i]);
      }
      // Destello corto en los cortes intermedios (los de cada escena ya llevan cortinilla)
      if (!calma) [1.5, 4.5, 7.5, 10.6].forEach((t) => {
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.55, duration: 0.05, ease: "none", immediateRender: false }, t - 0.05);
        tl.fromTo("#flash", { opacity: 0.55 }, { opacity: 0, duration: 0.18, ease: "power2.out", immediateRender: false }, t);
      });
      tl.set("#flash", { opacity: 0 }, 0);
      // Sacudida del texto cuando termina de entrar, y al cambiar de toma dentro de la misma escena
      if (!calma) [0, 3, 6, 9].forEach((t, i) => {
        const cap = `#s${i + 1} .cap`;
        tl.fromTo(cap, { x: 0, rotation: 0 }, { x: 10, rotation: 0.8, duration: 0.05, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, t + 0.75);
        tl.fromTo(cap, { scale: 1 }, { scale: 1.05, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t + 1.5);
      });
      // Cierre: el botón entra con más fuerza y el logo gira
      if (!calma) tl.fromTo("#end-logo", { rotation: 0 }, { rotation: 360, duration: 0.8, ease: "power3.inOut", immediateRender: false }, 13.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
