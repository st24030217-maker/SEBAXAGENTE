<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Agente Sebax</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Mismo sistema visual que el portafolio de sss.solutions: monocromático negro & blanco. */
:root{
  --bg:#000000;--surface:#0a0a0a;--surface-hover:#141414;--glass:rgba(10,10,10,.75);
  --line:rgba(255,255,255,.12);--line-glow:rgba(255,255,255,.25);
  --fg:#ffffff;--text:#a1a1aa;--muted:#71717a;--chip:rgba(255,255,255,.06);
  --primary-rgb:255,255,255;--inv-bg:#ffffff;--inv-fg:#000000;
  --n1:#ffffff;--n2:#d4d4d8;--n3:#a1a1aa;--n4:#71717a;--n5:#52525b;--n6:#3f3f46;
  --bad:#f87171;
  --shadow:0 8px 30px rgba(0,0,0,.8);--glow:0 0 25px rgba(255,255,255,.15);
  --font-h:"Outfit",system-ui,sans-serif;--font-b:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --t:.2s cubic-bezier(.4,0,.2,1);--t2:.4s cubic-bezier(.4,0,.2,1);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#ffffff;--surface:#f4f4f5;--surface-hover:#e4e4e7;--glass:rgba(255,255,255,.85);
  --line:rgba(0,0,0,.12);--line-glow:rgba(0,0,0,.2);
  --fg:#09090b;--text:#52525b;--muted:#71717a;--chip:rgba(0,0,0,.05);
  --primary-rgb:9,9,11;--inv-bg:#09090b;--inv-fg:#ffffff;
  --n1:#09090b;--n2:#27272a;--n3:#52525b;--n4:#71717a;--n5:#a1a1aa;--n6:#d4d4d8;
  --bad:#dc2626;
  --shadow:0 8px 30px rgba(0,0,0,.08);--glow:0 0 25px rgba(0,0,0,.08);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14.5px/1.6 var(--font-b);transition:background-color var(--t2),color var(--t2)}
/* Fondo: cuadrícula + brillos tenues, igual que el hero del portafolio */
.fondo{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.fondo .grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;opacity:.15;
  -webkit-mask-image:radial-gradient(circle at 50% 30%,#000 30%,transparent 80%);mask-image:radial-gradient(circle at 50% 30%,#000 30%,transparent 80%)}
.fondo .glow{position:absolute;border-radius:50%;filter:blur(60px);animation:flota 10s infinite alternate}
.fondo .g1{top:-5%;left:15%;width:420px;height:420px;background:radial-gradient(circle,rgba(var(--primary-rgb),.10),transparent 70%)}
.fondo .g2{bottom:0;right:5%;width:520px;height:520px;background:radial-gradient(circle,rgba(161,161,170,.08),transparent 70%);animation-direction:alternate-reverse;animation-duration:14s}
@keyframes flota{to{transform:translate(30px,20px) scale(1.08)}}
h1,h2,h3,h4{font-family:var(--font-h);color:var(--fg);font-weight:700;line-height:1.2}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a{color:var(--fg)}
code{background:var(--chip);border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:.9em;color:var(--fg)}
b,strong{color:var(--fg)}
.muted{color:var(--muted)}
h2{font-size:17px;margin:26px 0 10px;letter-spacing:-.01em}
.text-gradient{background:linear-gradient(180deg,var(--n1) 15%,var(--n3) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* ---------- App shell ---------- */
.shell{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 14px;display:flex;flex-direction:column;gap:26px;border-right:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px}
.brand img{height:26px;width:auto}
:root[data-theme="light"] .brand img,:root[data-theme="light"] .logo-img{filter:invert(1)}
.brand-name{font-family:var(--font-h);font-weight:800;font-size:19px;color:var(--fg);letter-spacing:-.01em}
.brand-name span{font-weight:400;color:var(--text)}
.brand-sub{display:block;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:-2px 0 0 10px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{all:unset;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--text);cursor:pointer;font-family:var(--font-h);font-weight:600;font-size:15px;position:relative;transition:all var(--t)}
.side nav button:hover{background:var(--chip);color:var(--fg)}
.side nav button.on{background:var(--chip);color:var(--fg)}
.side nav button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:4px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--n1),var(--n3));opacity:.0}
.side nav button.on::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:2px;background:var(--fg);border-radius:2px}
.side-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 0 10px;font-size:12.5px;color:var(--muted)}
.estado-red{display:inline-flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fg);box-shadow:0 0 10px var(--fg);animation:late 1.8s infinite}
@keyframes late{50%{opacity:.35}}
.tema{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--fg);transition:all var(--t)}
.tema:hover{border-color:var(--fg);transform:rotate(15deg)}
.tema svg{width:17px;height:17px}
.content{min-width:0}
.topbar{display:none}
main{padding:34px 36px 64px;max-width:1200px;margin:0 auto;animation:entra .5s cubic-bezier(.4,0,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(14px)}}
.tabbar{display:none}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar img{height:22px}
  .topbar .brand-name{font-size:17px}
  .topbar .tema{margin-left:auto;width:34px;height:34px}
  main{padding:18px 16px calc(100px + env(safe-area-inset-bottom))}
  .tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:15;padding:6px;border-radius:24px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow)}
  .tabbar button{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:18px;color:var(--muted);font-family:var(--font-h);font-size:11px;font-weight:600;cursor:pointer;transition:all var(--t)}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button.on{color:var(--inv-fg);background:var(--inv-bg)}
}

/* ---------- Componentes base ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;transition:transform var(--t2),border-color var(--t2),box-shadow var(--t2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi span{color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
.kpi b{display:block;font-family:var(--font-h);font-size:30px;font-weight:800;letter-spacing:-1px;margin:4px 0 2px}
.chip,.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;background:var(--chip);color:var(--text);border:1px solid var(--line)}
.chip.ok{color:var(--fg);border-color:var(--line-glow);background:rgba(var(--primary-rgb),.08)}
.chip.warn{color:var(--fg);border-style:dashed;border-color:var(--line-glow)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.chip i.pt{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
button.b,a.b{font-family:var(--font-h);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:30px;cursor:pointer;text-decoration:none;
  background:rgba(var(--primary-rgb),.06);border:1px solid var(--line-glow);color:var(--fg);transition:all var(--t2)}
button.b:hover,a.b:hover{background:rgba(var(--primary-rgb),.12);border-color:var(--fg);transform:translateY(-2px)}
button.b:active,a.b:active{transform:scale(.97)}
button.b:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.p,a.p{background:var(--inv-bg);color:var(--inv-fg);border-color:transparent;font-weight:700;box-shadow:0 4px 20px rgba(var(--primary-rgb),.2)}
button.p:hover,a.p:hover{background:var(--inv-bg);color:var(--inv-fg);border-color:transparent;box-shadow:0 8px 30px rgba(var(--primary-rgb),.35);transform:translateY(-3px)}
.ghost{background:transparent!important;border-color:transparent!important}
.ghost:hover{border-color:var(--line)!important}
select,input,textarea{font:inherit;color:var(--fg);background:var(--surface-hover);border:1px solid var(--line);border-radius:12px;padding:11px 15px;outline:none;transition:all var(--t)}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus,textarea:focus,select:focus{border-color:var(--fg);box-shadow:0 0 0 3px rgba(var(--primary-rgb),.15);background:var(--surface)}
textarea{resize:vertical;line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.scroll{overflow-x:auto;border-radius:20px;border:1px solid var(--line);background:var(--surface)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line);vertical-align:top}
td{color:var(--text)}
tr:last-child td{border-bottom:0}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-hover)}
.split{display:grid;grid-template-columns:340px 1fr;gap:14px;min-height:70vh}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.list{max-height:76vh;overflow:auto;padding:0}
.item{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background var(--t)}.item:hover,.item.on{background:var(--surface-hover)}
.item small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:16px}
.m{max-width:80%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;color:var(--fg)}
.m.cliente{align-self:flex-start;background:var(--surface-hover);border-bottom-left-radius:4px}
.m.agente{align-self:flex-end;background:var(--inv-bg);color:var(--inv-fg);border-bottom-right-radius:4px}
.m.humano{align-self:flex-end;background:var(--n6);color:var(--n1);border-bottom-right-radius:4px}
.m small{display:block;opacity:.6;font-size:11px;margin-top:3px}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px}
.bars div{flex:1;background:linear-gradient(180deg,var(--n1),var(--n4));border-radius:6px 6px 2px 2px;min-height:3px}
.aviso{display:flex;gap:12px;align-items:flex-start;border:1px dashed var(--line-glow);background:var(--surface);padding:14px 16px;border-radius:16px;margin:0 0 18px;font-size:13.5px}
.aviso svg{color:var(--fg);margin-top:1px}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:16px}
.login{width:100%;max-width:400px;text-align:center;padding:34px 28px;background:var(--glass);backdrop-filter:blur(14px)}
.login .logo-img{height:44px;margin:0 auto 16px;display:block}
.login h1{font-size:28px;margin:0 0 6px;letter-spacing:-1px;font-weight:800}
.login form{display:flex;flex-direction:column;gap:10px;margin-top:22px}

/* ---------- Prospección ---------- */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:24px;animation:entra .8s .05s both}
.hero-tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-h);font-weight:600;font-size:13px;color:var(--text);margin-bottom:10px}
.hero h1{font-size:clamp(30px,5.2vw,48px);margin:0;letter-spacing:-2px;font-weight:900;line-height:1.05}
.hero p{margin:10px 0 0;color:var(--text);font-size:15.5px}
.estado-cfg{display:flex;gap:6px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:860px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.stat{position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--n1),var(--n3));opacity:0;transition:opacity var(--t)}
.stat:hover{transform:translateY(-4px);border-color:rgba(var(--primary-rgb),.4)}
.stat:hover::before{opacity:1}
.stat span{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
.stat b{display:block;font-family:var(--font-h);font-size:36px;font-weight:800;letter-spacing:-1.5px;margin:6px 0 0;line-height:1.1}
.stat b small{font-size:16px;font-weight:600;color:var(--muted);letter-spacing:0}
.stat > small{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px}
.stat > small svg{width:14px;height:14px}
.stat.dest{background:var(--inv-bg);border-color:transparent;box-shadow:0 4px 20px rgba(var(--primary-rgb),.2)}
.stat.dest span,.stat.dest > small{color:var(--inv-fg);opacity:.6}
.stat.dest b{color:var(--inv-fg)}
.stat.dest::before{display:none}
.stat .mini-ring{position:absolute;right:16px;top:16px}
.tubo{margin-top:14px}
.piloto{display:flex;gap:14px;align-items:flex-start;margin-top:14px}
.piloto-ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);flex:none}
.piloto-ico.on{background:var(--inv-bg);color:var(--inv-fg);border-color:transparent}
.piloto-ico.on svg{animation:gira 6s linear infinite}
.piloto-t{font-family:var(--font-h);font-size:16px}
.piloto p{margin:4px 0 2px;color:var(--text);font-size:14px}
.piloto small{color:var(--muted);font-size:12.5px}
.tubo-bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--surface-hover);gap:2px}
.tubo-bar i{display:block;height:100%;transition:width 1.5s cubic-bezier(.1,.8,.2,1)}
.tubo-ley{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.tubo-ley span{display:inline-flex;align-items:center;gap:7px}.tubo-ley i{width:8px;height:8px;border-radius:50%;display:inline-block}
.buscador{margin-top:14px;padding:24px}
.buscador h3{margin:0;font-size:21px;letter-spacing:-.5px}
.buscador .sub{color:var(--text);font-size:14px;margin:4px 0 18px}
.etq{font-family:var(--font-h);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.toggles button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:25px;border:1px solid var(--line);background:var(--surface-hover);color:var(--text);font-family:var(--font-h);font-size:14px;font-weight:600;transition:all var(--t)}
.toggles button svg{width:16px;height:16px}
.toggles button:hover{color:var(--fg);border-color:var(--line-glow)}
.toggles button.on{background:linear-gradient(135deg,var(--n1),var(--n3));color:var(--inv-fg);border-color:transparent;box-shadow:0 4px 15px rgba(var(--primary-rgb),.2)}
.btn-big{width:100%;padding:15px 22px!important;font-size:15.5px!important}
.extras{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.extras .b{font-size:13px;padding:8px 16px}
.lista-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:34px 0 14px;flex-wrap:wrap}
.lista-head h2{margin:0;font-size:26px;letter-spacing:-1px;font-weight:800}
.tabs-p{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none;margin:0 -2px}
.tabs-p::-webkit-scrollbar{display:none}
.tabs-p button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:8px 18px;border-radius:25px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-family:var(--font-h);font-size:14px;font-weight:600;white-space:nowrap;transition:all var(--t)}
.tabs-p button:hover{color:var(--fg)}
.tabs-p button.on{background:linear-gradient(135deg,var(--n1),var(--n3));color:var(--inv-fg);border-color:transparent;box-shadow:0 4px 15px rgba(var(--primary-rgb),.2)}
.tabs-p button em{font-style:normal;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--chip)}
.tabs-p button.on em{background:rgba(0,0,0,.15)}
.buscar-in{position:relative;margin-bottom:14px}
.buscar-in svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.buscar-in input{width:100%;padding-left:46px;border-radius:30px;background:var(--surface)}
.pros{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
@media (max-width:860px){.pros{grid-template-columns:minmax(0,1fr);gap:10px}}
.pros>*,.stats>*,.grid>*{min-width:0}
.pro{display:flex;gap:14px;align-items:center;padding:16px;cursor:pointer;border-radius:20px;animation:entra .5s ease both;transition:transform .5s cubic-bezier(.175,.885,.32,1.275),box-shadow .4s,border-color .4s}
.pro:hover{transform:translateY(-4px);border-color:rgba(var(--primary-rgb),.3);box-shadow:var(--shadow),var(--glow)}
.pro:active{transform:scale(.985)}
.pro-body{flex:1;min-width:0}
.pro-top{display:flex;align-items:center;gap:8px}
.pro-top b{font-family:var(--font-h);font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pro small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pro small svg{width:13px;height:13px}
.pro-meta{display:flex;align-items:center;gap:6px;margin-top:9px;min-width:0}
.ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);opacity:.35;flex:none}
.ic svg{width:13px;height:13px}
.ic.on{opacity:1;color:var(--fg);border-color:var(--line-glow);background:rgba(var(--primary-rgb),.06)}
.pro-meta em{font-style:normal;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:4px}
.ring{--v:0;--c:var(--n4);width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--v) * 1%),var(--surface-hover) 0)}
.ring::before{content:"";grid-area:1/1;width:calc(100% - 8px);height:calc(100% - 8px);border-radius:50%;background:var(--surface)}
.ring b{grid-area:1/1;position:relative;font-family:var(--font-h);font-size:17px;font-weight:800;color:var(--fg)}
.ring.alto{--c:var(--n1)}.ring.medio{--c:var(--n3)}.ring.bajo{--c:var(--n5)}
.ring.big{width:64px;height:64px}.ring.big::before{width:calc(100% - 10px);height:calc(100% - 10px)}.ring.big b{font-size:22px}
.ring.anim{animation:gira 1s linear infinite;--v:28;--c:var(--fg)}
@keyframes gira{to{transform:rotate(360deg)}}
.wa-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--inv-bg);color:var(--inv-fg);box-shadow:0 4px 20px rgba(var(--primary-rgb),.2);transition:all var(--t2)}

/* ---------- Hoja de detalle ---------- */
.hoja{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fondo .25s ease}

.sheet{width:100%;max-width:660px;max-height:94vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:sube .4s cubic-bezier(.2,.9,.25,1);box-shadow:var(--shadow)}

async function api(path, opts = {}) {
  const res = await fetch("/admin/api" + path, { ...opts, headers: { "Content-Type": "application/json", "x-admin-token": token, ...(opts.headers || {}) } });
  if (res.status === 401 && sinToken) {
    const clave = prompt("Esta acción es delicada y pide la contraseña del panel (ADMIN_TOKEN):");
    if (clave) { token = clave.trim(); store.set("admin_token", token); return api(path, opts); }
    throw new Error("Se necesita la contraseña para esta acción");
  }
  if (res.status === 401) { store.del("admin_token"); token = ""; sinToken = false; login(); throw new Error("No autorizado"); }
  const d = await res.json();
  if (!res.ok) throw new Error(d.error || "Error");
  return d;
}

const aplicarTema = () => {
  const real = tema === "auto" ? (sistemaOscuro && !sistemaOscuro.matches ? "light" : "dark") : tema;
  document.documentElement.setAttribute("data-theme", real);
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", real === "dark" ? "#000000" : "#ffffff");

  document.querySelectorAll("[data-tema]").forEach((b) => (b.onclick = () => {

function toast(msg, tipo = "ok") {
  const t = document.createElement("div");
  t.className = "toast " + tipo;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add("out"), 2600);
  setTimeout(() => t.remove(), 3000);
}

// En la red de casa el servidor no pide contraseña: probamos antes de mostrar el login.
async function probarRedLocal() {
  try { const r = await fetch("/admin/api/config"); if (r.ok) { sinToken = true; return render(); } } catch {}
  login();
}

function login() {
  $("#app").innerHTML = `<div class="fondo"><div class="grid-bg"></div><div class="glow g1"></div><div class="glow g2"></div></div><div class="login-wrap"><div class="card login">${LOGO}<h1 class="text-gradient">Agente Sebax</h1><p class="muted" style="margin:0">Escribe tu clave de acceso (ADMIN_TOKEN del archivo .env).</p>
  <form id="f"><input id="t" type="password" placeholder="Clave de acceso" autofocus><button class="b p btn-big">Entrar</button></form><p id="e" class="muted"></p></div></div>`;
  $("#f").onsubmit = async (e) => { e.preventDefault(); token = $("#t").value.trim(); try { await api("/config"); store.set("admin_token", token); render(); } catch (err) { $("#e").textContent = err.message; } };
}

function ir(t) {

}

function menuMas() {
  const el = document.createElement("div");

// Tarjeta del piloto automático: qué buscó, qué sigue y cuándo.
const cuandoRel = (iso) => {
  const m = Math.round((new Date(iso) - Date.now()) / 60000);
  if (m <= 0) return "en unos momentos";
  if (m < 60) return `en ${m} min`;
  return `en ${Math.round(m / 60)} h`;
};
function pilotoHtml(a) {
  if (!a) return "";

  const estado = !a.activa ? "Apagado" : a.motivo ? "En pausa" : "Activo";

    ? "Actívalo en config/prospeccion.yaml (automatico.buscar: true)."
    : a.motivo
      ? esc(a.motivo.charAt(0).toUpperCase() + a.motivo.slice(1)) + "."
      : `Próxima búsqueda: <b>${esc(a.siguiente)}</b> ${cuandoRel(a.proxima)}.`;

    ? `Última: ${esc(a.ultimo.busqueda || "")}${a.ultimo.nuevos != null ? ` · ${a.ultimo.nuevos} nuevos` : ""} · ${fecha(a.ultimo.fecha)}`
    : "Aún no ha buscado por su cuenta.";

async function listaProspectos() {
  const estado = pFiltro === "todos" ? "" : pFiltro;
  const rows = await api(`/prospectos?estado=${estado}&q=${encodeURIComponent($("#pq")?.value || "")}`);
  if (!rows.length) {
    $("#plist").innerHTML = `<div class="vacio">${LOGO}<b>Nada por aquí todavía</b><p style="margin:4px 0 0">${pFiltro === "por_revisar" ? "Busca negocios arriba y aparecerán aquí listos para revisar." : "Cuando haya negocios en esta etapa, los verás aquí."}</p></div>`;
    return;
  }
  $("#plist").innerHTML = `<div class="pros">${rows.map((p, i) => {
    const [et, cl] = P_ESTADO[p.estado] || [p.estado, ""];
    const raz = (parse(p.razones) || [])[0] || "";
    const puedeWa = p.telefono && !["no_contactar", "descartado"].includes(p.estado);
    return `<article class="card pro" data-p="${p.id}" style="animation-delay:${Math.min(i, 12) * 25}ms">${ring(p)}
      <div class="pro-body"><div class="pro-top"><b>${esc(p.nombre)}</b>${p.estado !== "por_revisar" ? chip(et, cl) : ""}</div>
      <small>${icoRubro(p.rubro)} ${esc(p.rubro || p.giro || "")} · ${esc(p.colonia ? p.colonia + ", " : "")}${esc(p.ciudad || "")}</small>
      <div class="pro-meta"><span class="ic ${p.email ? "on" : ""}" title="Correo">${ico("mail")}</span><span class="ic ${p.telefono ? "on" : ""}" title="Teléfono">${ico("phone")}</span><span class="ic ${p.sitio_web ? "on" : ""}" title="Página web">${ico("globe")}</span><em>${esc(raz)}</em></div></div>
      ${puedeWa && !["enviado", "aprobado", "whatsapp", "respondio", "cliente"].includes(p.estado) ? `<a class="wa-btn" data-wa="${p.id}" title="${waInfo?.estado === "conectado" ? "Aprobar y enviar por WhatsApp" : "Abrir WhatsApp en mi celular"}" target="_blank" rel="noopener" href="#">${WA_ICO}</a>` : ""}
    </article>`;
  }).join("")}</div>`;
  document.querySelectorAll(".pro").forEach((el) => (el.onclick = () => abrirProspecto(el.dataset.p)));
  // WhatsApp directo desde la tarjeta: trae el texto redactado, abre WhatsApp y lo marca como contactado.
  document.querySelectorAll("[data-wa]").forEach((a) => (a.onclick = async (e) => {
    e.stopPropagation(); e.preventDefault();
    if (waInfo?.estado === "conectado") {
      try { await post(`/prospectos/${a.dataset.wa}/aprobar`); toast("En cola: sale por WhatsApp en los próximos minutos"); setTimeout(listaProspectos, 400); }
      catch (err) { toast(err.message, "bad"); }
      return;
    }
    const win = window.open("", "_blank");
    try {
      const p = await api("/prospectos/" + a.dataset.wa);
      if (win) win.location = waLink(p.telefono, p.whatsapp_texto); else location.href = waLink(p.telefono, p.whatsapp_texto);
      if (!["respondio", "cliente"].includes(p.estado)) await api("/prospectos/" + p.id, { method: "PATCH", body: JSON.stringify({ estado: "whatsapp" }) });
      toast("Marcado como contactado por WhatsApp");
      setTimeout(listaProspectos, 600);
    } catch (err) { win?.close(); toast(err.message, "bad"); }
  }));
}

    </div>
    <div class="razones">${chip(et, cl)}${raz.map((r) => chip(r)).join("")}</div>
    ${ejemplo ? `<div class="aviso" style="margin:14px 0 0">${ico("flask")}<div>Es un negocio de <b>ejemplo</b>: puedes probar todo, pero nunca se le envía nada.</div></div>` : ""}
    ${p.error ? `<div class="aviso" style="margin:14px 0 0">${ico("alert")}<div>${esc(p.error)}</div></div>` : ""}
    <div class="seg">
      <button data-m="correo" class="${panelInicial === "correo" ? "on" : ""}">${ico("mail")} Correo</button>
      <button data-m="wa" class="${panelInicial === "wa" ? "on" : ""}">${ico("msg")} WhatsApp</button>
      <button data-m="datos">${ico("idcard")} Datos</button>
    </div>
    <div data-panel="correo" ${panelInicial === "correo" ? "" : "hidden"}>
      ${p.email ? "" : `<p class="muted" style="font-size:13px">Este negocio no tiene correo. Si lo consigues, agrégalo en <b>Datos</b>.</p>`}
      <label>Asunto</label><input id="as" value="${esc(p.asunto || "")}">
      <label>Mensaje</label><textarea id="co" rows="10">${esc(p.correo || "")}</textarea>
    </div>
    <div data-panel="wa" ${panelInicial === "wa" ? "" : "hidden"}>
      <label>Mensaje de WhatsApp</label><textarea id="wt" rows="7">${esc(p.whatsapp_texto || "")}</textarea>
    </div>
    <div data-panel="datos" hidden>
      <label>Correo del negocio</label><input id="em" value="${esc(p.email || "")}" placeholder="sin correo" type="email">
      <label>Teléfono / WhatsApp</label><input id="tel" value="${esc(p.telefono || "")}" placeholder="sin teléfono" inputmode="tel">
      <label>Notas</label><textarea id="nt" rows="3" placeholder="Ej. hablé con el dueño, le interesa para enero">${esc(p.notas || "")}</textarea>
    </div>
    <div class="acciones">
      ${(p.telefono || p.email) && !["enviado", "aprobado", "no_contactar"].includes(p.estado) ? `<button class="b p full btn-big" id="ap">${ico("send")} ${p.telefono ? (chipWa ? "Aprobar y enviar por WhatsApp" : "Aprobar (sale al conectar el chip)") : "Aprobar y enviar correo"}</button>` : ""}
      ${p.estado === "aprobado" ? `<button class="b full" id="desap">${ico("undo")} Sacar de la cola de envío</button>` : ""}
      ${p.telefono && p.estado !== "no_contactar" ? `<a class="b full" id="wa" href="${waLink(p.telefono, p.whatsapp_texto)}" target="_blank" rel="noopener">${ico("phone")} Enviar yo desde mi celular</a>` : ""}
      <button class="b" id="resp">${ico("hand")} Respondió</button>
      <button class="b" id="cli">${ico("star")} Es cliente</button>
      <button class="b" id="re">${ico("refresh")} Redactar otra vez</button>
      <button class="b" id="gu">${ico("save")} Guardar</button>
      <button class="b ghost full peligro" id="desc">${ico("trash")} Descartar</button>
    </div>
    <p class="nota-pie">${p.envios ? `Correos enviados: ${p.envios}${p.ultimo_envio ? " · último " + fecha(p.ultimo_envio) : ""} · ` : ""}Cada correo lleva tu firma y la opción de darse de baja.</p>
  </div>`;
  document.body.appendChild(el);
  el.onclick = (e) => { if (e.target === el) cerrar(); };
  el.querySelectorAll(".seg button").forEach((b) => (b.onclick = () => {
    el.querySelectorAll(".seg button").forEach((x) => x.classList.toggle("on", x === b));
    el.querySelectorAll("[data-panel]").forEach((pn) => (pn.hidden = pn.dataset.panel !== b.dataset.m));
  }));
  const campos = () => ({ email: $("#em").value.trim(), telefono: $("#tel").value.replace(/\D/g, ""), asunto: $("#as").value, correo: $("#co").value, whatsapp_texto: $("#wt").value, notas: $("#nt").value });
  const guardar = (extra = {}) => api("/prospectos/" + id, { method: "PATCH", body: JSON.stringify({ ...campos(), ...extra }) });
  const accion = (sel, fn) => $(sel, el) && ($(sel, el).onclick = async (e) => { try { await fn(e); } catch (err) { toast(err.message, "bad"); } });
  $("#wt").oninput = () => $("#wa") && ($("#wa").href = waLink($("#tel").value || p.telefono, $("#wt").value));
  accion("#x", cerrar);
  accion("#gu", async () => { await guardar(); toast("Cambios guardados"); cerrar(); });
  accion("#ap", async () => {
    if (!confirm(ejemplo ? "Es un ejemplo: quedará aprobado pero no se envía. ¿Seguir?" : p.telefono ? "¿Enviar este mensaje por WhatsApp? Sale en los próximos minutos, dentro del horario." : `¿Enviar este correo a ${$("#em").value}? Sale en los próximos minutos (dentro del horario).`)) return;
    await guardar(); await post(`/prospectos/${id}/aprobar`); toast("Aprobado: queda en la cola de envío"); cerrar();
  });
  accion("#desap", async () => { await guardar({ estado: "por_revisar" }); toast("Lo sacaste de la cola"); cerrar(); });
  accion("#wa", async () => { await guardar({ estado: "whatsapp" }); toast("Marcado como contactado por WhatsApp"); setTimeout(cerrar, 300); });
  accion("#re", async (e) => {
    const b = e.currentTarget; b.disabled = true; b.innerHTML = `<div class="ring anim" style="width:18px;height:18px"></div> Redactando…`;
    const r = await post(`/prospectos/${id}/redactar`);
    $("#as").value = r.asunto || ""; $("#co").value = r.correo || ""; $("#wt").value = r.whatsapp_texto || "";
    b.disabled = false; b.innerHTML = `${ico("refresh")} Redactar otra vez`; toast("Mensaje nuevo listo");
  });
  accion("#resp", async () => { await guardar({ estado: "respondio" }); toast("Marcado como respondió"); cerrar(); });
  accion("#cli", async () => { await guardar({ estado: "cliente" }); toast("Nuevo cliente registrado"); cerrar(); });
  accion("#desc", async () => { await guardar({ estado: "descartado" }); toast("Descartado"); cerrar(); });
}

const VIEWS = {
  prospeccion: vistaProspeccion,

  async resumen() {
    const dias = Number(store.get("admin_dias") || 30);
    const r = await api("/resumen?dias=" + dias);
    moneda = r.moneda;
    const max = Math.max(1, ...r.ventasPorDia.map((d) => d.monto));
    const etapas = ["nuevo", "interesado", "cotizado", "negociacion", "ganado", "perdido"];
    const emb = Object.fromEntries(r.embudo.map((e) => [e.etapa, e.n]));
    $("#main").innerHTML = `<div class="row"><select id="dias">${[7, 30, 90, 365].map((d) => `<option value="${d}" ${d === dias ? "selected" : ""}>Últimos ${d} días</option>`).join("")}</select></div>
    <div class="grid">
      <div class="card kpi"><span>Ventas pagadas</span><b>${money(r.pagados.monto)}</b><span>${r.pagados.n} pedidos</span></div>
      <div class="card kpi"><span>Pedidos creados</span><b>${r.pedidos.n}</b><span>${money(r.pedidos.monto)}</span></div>
      <div class="card kpi"><span>Cotizaciones</span><b>${r.cotizaciones.n}</b><span>${money(r.cotizaciones.monto)}</span></div>
      <div class="card kpi"><span>Conversaciones</span><b>${r.conversaciones}</b><span>${r.leads} leads</span></div>
      <div class="card kpi"><span>Conversión a venta</span><b>${r.conversion}%</b><span>pagados / conversaciones</span></div>
      <div class="card kpi"><span>Citas agendadas</span><b>${r.citas}</b><span>${r.derivaciones} derivadas a humano</span></div>
      <div class="card kpi"><span>Costo IA (estimado)</span><b>US$ ${r.ia.costoUsdEstimado}</b><span>${r.ia.llamadas} llamadas</span></div>
    </div>
    <h2>Ventas por día</h2><div class="card">${r.ventasPorDia.length ? `<div class="bars">${r.ventasPorDia.map((d) => `<div title="${d.dia}: ${money(d.monto)}" style="height:${(d.monto / max) * 100}%"></div>`).join("")}</div>` : '<p class="muted">Aún no hay ventas pagadas en este período.</p>'}</div>
    <h2>Embudo de ventas</h2><div class="grid">${etapas.map((e) => `<div class="card kpi"><span>${e}</span><b>${emb[e] || 0}</b></div>`).join("")}</div>
    <h2>Por canal</h2><div class="grid">${r.porCanal.map((c) => `<div class="card kpi"><span>${esc(c.canal)}</span><b>${c.n}</b></div>`).join("") || '<p class="muted">Sin datos</p>'}</div>`;
    $("#dias").onchange = (e) => { store.set("admin_dias", e.target.value); VIEWS.resumen(); };
  },

  async conversaciones() {
    $("#main").innerHTML = `<div class="split"><div class="card list"><div class="row" style="padding:10px;margin:0"><input id="q" placeholder="Buscar nombre, teléfono, email" style="flex:1"><select id="fl"><option value="todas">Todas</option><option value="pausadas">Atiende humano</option></select></div><div id="lista"></div></div><div class="card" id="det"><p class="muted">Selecciona una conversación.</p></div></div>`;
    const cargar = async () => {
      const rows = await api(`/conversaciones?q=${encodeURIComponent($("#q").value)}&filtro=${$("#fl").value}`);
      $("#lista").innerHTML = rows.map((c) => `<div class="item ${c.id === convSel ? "on" : ""}" data-id="${esc(c.id)}"><b>${esc(c.nombre || c.id)}</b> ${chip(c.canal)} ${c.bot_activo ? "" : chip("humano", "warn")} ${c.etapa ? chip(c.etapa, ETAPA_CLASE[c.etapa]) : ""}<small>${esc(c.ultimo || "")}</small><small>${fecha(c.actualizado)}</small></div>`).join("") || '<p class="muted" style="padding:12px">Sin conversaciones todavía.</p>';
      document.querySelectorAll(".item").forEach((el) => (el.onclick = () => { convSel = el.dataset.id; cargar(); detalle(convSel); }));
    };
    $("#q").oninput = () => cargar();
    $("#fl").onchange = () => cargar();
    await cargar();
    if (convSel) detalle(convSel);
  },

  async leads() {
    const etapa = store.get("admin_etapa") || "";
    const rows = await api("/leads" + (etapa ? "?etapa=" + etapa : ""));
    $("#main").innerHTML = `<div class="row"><select id="et"><option value="">Todas las etapas</option>${["nuevo", "interesado", "cotizado", "negociacion", "ganado", "perdido"].map((e) => `<option ${e === etapa ? "selected" : ""}>${e}</option>`).join("")}</select><button class="b" id="csv">${ico("save")} Exportar CSV</button></div>
    <div class="scroll"><table><tr><th>Nombre</th><th>Contacto</th><th>Necesidad</th><th>Etapa</th><th>Prob.</th><th>Canal</th><th>Actualizado</th></tr>
    ${rows.map((l) => `<tr class="click" data-id="${esc(l.conversacion_id)}"><td>${esc(l.nombre || "-")}<br><small class="muted">${esc(l.empresa || "")}</small></td><td>${esc(l.telefono || "")}<br>${esc(l.email || "")}</td><td>${esc(l.necesidad || "")}</td><td>${chip(l.etapa, ETAPA_CLASE[l.etapa])}</td><td>${l.puntaje ?? "-"}</td><td>${esc(l.canal)}</td><td>${fecha(l.actualizado)}</td></tr>`).join("") || '<tr><td colspan="7" class="muted">Sin leads</td></tr>'}</table></div>`;
    $("#et").onchange = (e) => { store.set("admin_etapa", e.target.value); VIEWS.leads(); };
    $("#csv").onclick = async () => { const r = await fetch("/admin/api/leads.csv", { headers: { "x-admin-token": token } }); const b = await r.blob(); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "leads.csv"; a.click(); };
    irAConversacion();
  },

  async pedidos() {
    const r0 = await api("/resumen?dias=1"); moneda = r0.moneda;
    const rows = await api("/pedidos");
    const estados = ["pendiente_pago", "pagado", "enviado", "entregado", "cancelado"];
    const cls = { pagado: "ok", entregado: "ok", enviado: "ok", cancelado: "bad", pendiente_pago: "warn" };
    $("#main").innerHTML = `<div class="scroll"><table><tr><th>#</th><th>Cliente</th><th>Productos</th><th>Total</th><th>Pago</th><th>Entrega</th><th>Estado</th><th>Fecha</th></tr>
    ${rows.map((p) => { const items = (JSON.parse(p.items).items || []).map((i) => `${i.cantidad} x ${esc(i.nombre)}`).join("<br>");
      return `<tr><td>${p.id}</td><td class="click" data-id="${esc(p.conversacion_id)}"><u>${esc(p.nombre || p.conversacion_id)}</u><br><small class="muted">${esc(p.canal)}</small></td><td>${items}</td><td>${money(p.total)}</td><td>${esc(p.metodo_pago || "")}${p.link_pago ? `<br><a href="${esc(p.link_pago)}" target="_blank" rel="noopener">link</a>` : ""}</td><td>${esc(p.entrega || "")}<br><small class="muted">${esc(p.direccion || "")}</small>${p.datos_facturacion ? `<br><small class="muted">Factura: ${esc(p.datos_facturacion)}</small>` : ""}</td>
      <td>${chip(p.estado, cls[p.estado])}<br><select data-p="${p.id}">${estados.map((e) => `<option ${e === p.estado ? "selected" : ""}>${e}</option>`).join("")}</select></td><td>${fecha(p.creado)}</td></tr>`; }).join("") || '<tr><td colspan="8" class="muted">Sin pedidos</td></tr>'}</table></div>
    <p class="muted">Al cambiar el estado, el cliente recibe un aviso automático por su canal.</p>`;
    document.querySelectorAll("select[data-p]").forEach((s) => (s.onchange = async () => { if (!confirm(`¿Cambiar pedido #${s.dataset.p} a "${s.value}" y avisar al cliente?`)) return VIEWS.pedidos(); try { await post(`/pedidos/${s.dataset.p}/estado`, { estado: s.value }); } catch (e) { alert(e.message); } VIEWS.pedidos(); }));
    irAConversacion();
  },

  async citas() {
    const rows = await api("/citas");
    $("#main").innerHTML = `<div class="scroll"><table><tr><th>Fecha</th><th>Cliente</th><th>Tipo</th><th>Notas</th><th>Estado</th></tr>
    ${rows.map((c) => `<tr><td>${fecha(c.inicio)}</td><td class="click" data-id="${esc(c.conversacion_id)}"><u>${esc(c.nombre || c.conversacion_id)}</u></td><td>${esc(c.tipo || "")}</td><td>${esc(c.notas || "")}</td><td><select data-c="${c.id}">${["confirmada", "realizada", "cancelada"].map((e) => `<option ${e === c.estado ? "selected" : ""}>${e}</option>`).join("")}</select></td></tr>`).join("") || '<tr><td colspan="5" class="muted">Sin citas</td></tr>'}</table></div>`;
    document.querySelectorAll("select[data-c]").forEach((s) => (s.onchange = async () => { await post(`/citas/${s.dataset.c}/estado`, { estado: s.value }); }));
    irAConversacion();
  },

  async seguimientos() {
    const rows = await api("/seguimientos");
    $("#main").innerHTML = `<div class="scroll"><table><tr><th>Programado</th><th>Cliente</th><th>Motivo</th><th>Origen</th><th>Estado</th><th></th></tr>
    ${rows.map((s) => `<tr><td>${fecha(s.ejecutar_en)}</td><td class="click" data-id="${esc(s.conversacion_id)}"><u>${esc(s.nombre || s.conversacion_id)}</u></td><td>${esc(s.contexto || "")}</td><td>${esc(s.origen)}</td><td>${chip(s.estado, { enviado: "ok", fallido: "bad", pendiente: "warn" }[s.estado])}</td><td>${s.estado === "pendiente" ? `<button class="b" data-s="${s.id}">Cancelar</button>` : ""}</td></tr>`).join("") || '<tr><td colspan="6" class="muted">Sin seguimientos</td></tr>'}</table></div>
    <p class="muted">Los seguimientos se envían solo dentro del horario de atención. En WhatsApp, fuera de las 24 h desde el último mensaje del cliente se necesita una plantilla aprobada.</p>`;
    document.querySelectorAll("button[data-s]").forEach((b) => (b.onclick = async () => { await post(`/seguimientos/${b.dataset.s}/cancelar`); VIEWS.seguimientos(); }));
    irAConversacion();
  },

  async ajustes() {
    const c = await api("/config");
    const si = (v) => (v ? chip("activo", "ok") : chip("no configurado"));
    $("#main").innerHTML = `<div class="grid"><div class="card"><h2>Negocio</h2><p>${esc(c.negocio)}</p><p class="muted">Modelo: ${esc(c.modelo)} · esfuerzo: ${esc(c.esfuerzo)} · pagos: ${esc(c.pagos)}</p>
    <button class="b p" id="rec">Recargar config/negocio.yaml</button><p id="rr" class="muted"></p></div>
    <div class="card"><h2>Canales</h2>${Object.entries(c.canales).map(([k, v]) => `<p>${esc(k)}: ${si(v)}</p>`).join("")}</div>
    <div class="card"><h2>Avisos al dueño</h2><p>Telegram: ${si(c.avisos.telegram)}</p><p>Webhook: ${si(c.avisos.webhook)}</p></div>
    <div class="card"><h2>Respaldo de datos</h2><p class="muted">Descarga todos tus datos (negocios, conversaciones, citas) o súbelos a otro lugar, por ejemplo de tu PC a la nube.</p>
      <div class="row" style="margin:12px 0 0"><button class="b p" id="resp-dl">${ico("save")} Descargar respaldo</button>
      <label class="b" style="margin:0">${ico("undo")} Restaurar respaldo<input type="file" id="resp-up" accept=".db" hidden></label></div><p id="resp-msg" class="muted"></p></div></div>`;
    $("#resp-dl").onclick = async () => {
      let r = await fetch("/admin/api/respaldo", { headers: { "x-admin-token": token } });
      if (r.status === 401) { const c = prompt("Descargar todos los datos pide la contraseña del panel:"); if (!c) return; token = c.trim(); store.set("admin_token", token); r = await fetch("/admin/api/respaldo", { headers: { "x-admin-token": token } }); }
      if (!r.ok) return toast("No se pudo descargar el respaldo", "bad");
      const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob()); a.download = `agente-respaldo-${new Date().toISOString().slice(0, 10)}.db`; a.click();
    };
    $("#resp-up").onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      if (!confirm(`¿Reemplazar TODOS los datos de este agente con "${f.name}"? Los datos actuales se guardan aparte por seguridad.`)) return;
      $("#resp-msg").textContent = "Subiendo…";
      try {
        if (sinToken && !store.get("admin_token")) { const c = prompt("Reemplazar los datos pide la contraseña del panel:"); if (!c) return; token = c.trim(); store.set("admin_token", token); }
        const r = await fetch("/admin/api/restaurar", { method: "POST", headers: { "x-admin-token": token, "Content-Type": "application/octet-stream" }, body: f });
        const d = await r.json(); if (!r.ok) throw new Error(d.error);
        $("#resp-msg").textContent = d.mensaje; setTimeout(() => location.reload(), 15000);
      } catch (err) { $("#resp-msg").textContent = "Error: " + err.message; }
    };
    $("#rec").onclick = async () => { try { const r = await post("/recargar-config"); $("#rr").textContent = `Recargado: ${r.productos} productos.`; } catch (e) { $("#rr").textContent = "Error: " + e.message; } };
  },
};

function irAConversacion() {
  document.querySelectorAll("[data-id]").forEach((el) => (el.onclick = () => { convSel = el.dataset.id; tab = "conversaciones"; store.set("admin_tab", tab); render(); }));
}

async function detalle(id) {
  const d = await api("/conversaciones/" + encodeURIComponent(id));
  const c = d.conversacion, l = d.lead || {};
  const r0 = await api("/resumen?dias=1"); moneda = r0.moneda;
  $("#det").innerHTML = `<div class="row"><h2 style="margin:0">${esc(c.nombre || c.id)}</h2>${chip(c.canal)} ${l.etapa ? chip(l.etapa, ETAPA_CLASE[l.etapa]) : ""}
    <button class="b" id="bot" style="margin-left:auto">${c.bot_activo ? "Pausar agente (atiendo yo)" : "Reactivar agente"}</button></div>
    <p class="muted">${[l.telefono, l.email, l.empresa].filter(Boolean).map(esc).join(" · ") || "Sin datos de contacto aún"}${l.necesidad ? `<br>Necesidad: ${esc(l.necesidad)}` : ""}${l.notas ? `<br>Notas: ${esc(l.notas).replace(/\n/g, "<br>")}` : ""}</p>
    <div class="row"><select id="etp">${["nuevo", "interesado", "cotizado", "negociacion", "ganado", "perdido"].map((e) => `<option ${e === l.etapa ? "selected" : ""}>${e}</option>`).join("")}</select><input id="nota" placeholder="Agregar nota interna" style="flex:1"><button class="b" id="gl">Guardar</button></div>
    <div class="chat" id="chat">${d.mensajes.map((m) => `<div class="m ${m.rol}">${esc(m.texto)}<small>${m.rol} · ${fecha(m.creado)}</small></div>`).join("")}</div>
    <form id="env" class="row" style="margin-top:8px"><textarea id="txt" rows="2" style="flex:1" placeholder="Responder como humano (se envía al cliente por ${esc(c.canal)} y pausa al agente)"></textarea><button class="b p">Enviar</button></form>
    ${d.cotizaciones.length ? `<h2>Cotizaciones</h2>${d.cotizaciones.map((q) => `<p>#${q.id} · ${money(q.total)} · ${fecha(q.creado)} <span class="muted">${(JSON.parse(q.items).items || []).map((i) => `${i.cantidad} x ${esc(i.nombre)}`).join(", ")}</span></p>`).join("")}` : ""}
    ${d.pedidos.length ? `<h2>Pedidos</h2>${d.pedidos.map((p) => `<p>#${p.id} · ${money(p.total)} · ${chip(p.estado)} · ${esc(p.metodo_pago || "")}</p>`).join("")}` : ""}
    ${d.citas.length ? `<h2>Citas</h2>${d.citas.map((x) => `<p>${fecha(x.inicio)} · ${esc(x.tipo || "")} · ${chip(x.estado)}</p>`).join("")}` : ""}`;
  const chat = $("#chat"); chat.scrollTop = chat.scrollHeight;
  $("#bot").onclick = async () => { await post(`/conversaciones/${encodeURIComponent(id)}/bot`, { activo: !c.bot_activo }); detalle(id); };
  $("#gl").onclick = async () => { await api(`/leads/${encodeURIComponent(id)}`, { method: "PATCH", body: JSON.stringify({ etapa: $("#etp").value, notas: $("#nota").value || undefined }) }); detalle(id); };
  $("#env").onsubmit = async (e) => { e.preventDefault(); const t = $("#txt").value.trim(); if (!t) return; try { await post(`/conversaciones/${encodeURIComponent(id)}/mensaje`, { texto: t }); detalle(id); } catch (err) { alert(err.message); } };
}

render();
setInterval(() => { if ((token || sinToken) && tab === "conversaciones" && convSel && !document.activeElement?.matches("textarea,input")) detalle(convSel).catch(() => {}); }, 15000);
</script>
</body>
</html>
